name: 项目提案
description: 提议一个有真实需求证据的小型开源工具
title: "[提案] "
labels:
  - proposal
body:
  - type: textarea
    id: problem
    attributes:
      label: 真实问题
      description: 谁在什么场景遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有方案
      description: 目前如何处理，为什么还不够？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 一周最小版本
      description: 一周内可以交付并验证什么？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验收证据
      description: 用什么测试、数据或真实反馈判断它有用？
    validations:
      required: true
  - type: checkboxes
    id: public-boundary
    attributes:
      label: 公开边界
      options:
        - label: 不包含公司代码、客户数据、密钥、生产配置或权属不明材料
          required: true
