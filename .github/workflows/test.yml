name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q websheet tests
      - run: python scripts/demo.py
  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify real Chromium demo and dashboard workflows
        run: python -m unittest discover -s tests -v
        env:
          WEBSHEET_BROWSER_TEST: '1'
      - name: Upload synthetic dashboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-dashboard-evidence
          path: test-artifacts/*.png
          if-no-files-found: warn
          retention-days: 3
  public-fixture:
    name: Opt-in public practice fixture (four requests maximum)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check invited sandbox through production HTTPS transport
        run: python scripts/public_smoke.py --project . --allow-public-network
