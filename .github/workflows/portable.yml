name: Portable desktop bundles
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Build and verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install pinned build and runtime dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Build native portable folder and ZIP
        run: python scripts/build_portable.py
      - name: Verify packaged executable with synthetic data
        run: python scripts/smoke_portable.py
      - name: Upload verified portable ZIP and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: websheet-agent-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/websheet-agent-*.zip
            dist/websheet-agent-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
